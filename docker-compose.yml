# ==============================================================================
# Starfall-Go Debrid — Production Docker Compose with Cgroups v2 Hardware Shield
# Target VPS: 2 vCPU, 4 GB RAM (Ubuntu 24.04 LTS / Debian 12)
# Guarantees >= 600 MiB physical RAM always remains free for Linux kernel & sshd
# ==============================================================================

name: starfall-go

services:
  starfall-debrid:
    build:
      context: .
      dockerfile: Dockerfile
    image: starfall-debrid:1.2.0
    container_name: starfall-debrid
    restart: unless-stopped

    # Strict Cgroups v2 & Compose resource shield (3400 MiB hard ceiling, 1.9 vCPU)
    deploy:
      resources:
        limits:
          memory: 3400M
          cpus: '1.9'
        reservations:
          memory: 512M
          cpus: '0.5'
    mem_limit: 3400m
    memswap_limit: 3800m
    cpus: 1.9
    pids_limit: 512
    oom_score_adj: 200

    # File descriptor ceiling (65535) to prevent socket exhaustion during 1Gbps transfers
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    ports:
      - "8080:8080"

    environment:
      - GOMEMLIMIT=3000MiB
      - GOGC=50
      - GOMAXPROCS=2
      - STARFALL_APP_LISTEN_ADDR=0.0.0.0:8080
      - STARFALL_APP_DOWNLOAD_DIR=/app/downloads
      - STARFALL_DATABASE_SQLITE_PATH=/app/data/starfall_users.db
      - STARFALL_MEMORY_SOFT_LIMIT_MIB=3000
      - STARFALL_MEMORY_HARD_CEILING_MIB=3200
      - STARFALL_MEMORY_WARN_PERCENT=70.0
      - STARFALL_MEMORY_CRITICAL_PERCENT=82.0
      - STARFALL_NETWORK_MAX_GLOBAL_CONNS=150
      - STARFALL_NETWORK_MAX_CONNS_PER_TASK=30
      - STARFALL_ENGINE_MAX_CONCURRENT_WORKERS=4
      - STARFALL_ENGINE_MAX_ACTIVE_DOWNLOADS=3
      - STARFALL_ENGINE_MAX_TELEGRAM_UPLOADS=2
      - STARFALL_ENGINE_MAX_LOSSLESS_REMUX=1
      - STARFALL_AUTH_GOOGLE_CLIENT_ID=${STARFALL_AUTH_GOOGLE_CLIENT_ID:-}
      - STARFALL_AUTH_GOOGLE_CLIENT_SECRET=${STARFALL_AUTH_GOOGLE_CLIENT_SECRET:-}
      - STARFALL_AUTH_GOOGLE_REDIRECT_URL=${STARFALL_AUTH_GOOGLE_REDIRECT_URL:-http://localhost:8080/auth/google/callback}
      - STARFALL_AUTH_JWT_SECRET=${STARFALL_AUTH_JWT_SECRET:-change_this_to_a_64_char_random_hex_secret_for_production_use}
      - STARFALL_TELEGRAM_API_ID=${STARFALL_TELEGRAM_API_ID:-0}
      - STARFALL_TELEGRAM_API_HASH=${STARFALL_TELEGRAM_API_HASH:-}
      - STARFALL_TELEGRAM_BOT_TOKEN=${STARFALL_TELEGRAM_BOT_TOKEN:-}

    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
