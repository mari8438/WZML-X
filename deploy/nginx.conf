# ==============================================================================
# Starfall-Go Debrid — Nginx Reverse Proxy (TLS 1.3 + WebSocket + Zero-Buffering)
# Place in: /etc/nginx/sites-available/starfall.conf
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream starfall_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name debrid.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name debrid.example.com;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/debrid.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/debrid.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow custom 16:9 thumbnail uploads up to 10 MiB
    client_max_body_size 10M;

    # Owner Live Log WebSocket Endpoint (/api/admin/logs)
    location /api/admin/logs {
        proxy_pass http://starfall_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Unbuffered Frame Extraction & Telemetry Endpoints
    location /api/video/frame {
        proxy_pass http://starfall_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Main Application, Google OAuth 2.0, & Video Tools Studio UI
    location / {
        proxy_pass http://starfall_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
